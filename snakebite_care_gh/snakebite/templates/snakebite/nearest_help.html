<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearest Help | VenomGuard AI</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      --bg: #0f3822;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f8fff6;
      --muted: #cfe2d1;
      --primary: #9fe59a;
      --primary-deep: #1e7a3e;
      --warning: #f0ba58;
      --danger: #e75d5d;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, rgba(159, 229, 154, 0.16), transparent 30%), linear-gradient(180deg, #123d26 0%, var(--bg) 55%, #0b2818 100%);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 14px 14px 102px;
    }

    .screen {
      width: 100%;
      max-width: 460px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      margin-bottom: 12px;
      border-radius: 16px;
      background: rgba(9, 31, 20, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .back-link {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 20px;
      line-height: 1;
    }

    .header-copy h1 {
      margin: 0;
      font-size: 0.96rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      line-height: 1.25;
    }

    .map-wrap {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      background: #153a27;
      height: 60vh;
      min-height: 320px;
    }

    #nearest-help-map {
      width: 100%;
      height: 100%;
    }

    .facility-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .facility-name {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .facility-line {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .status-ok {
      margin: 5px 0 0;
      font-size: 0.86rem;
      font-weight: 700;
      color: #81f0b1;
    }

    .green-pin {
      width: 20px;
      height: 20px;
      border-radius: 50% 50% 50% 0;
      background: #1e7a3e;
      transform: rotate(-45deg);
      border: 2px solid #c7f5d2;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .green-pin::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eafbeb;
      position: absolute;
      top: 4px;
      left: 4px;
    }

    .gold-pin {
      width: 20px;
      height: 20px;
      border-radius: 50% 50% 50% 0;
      background: #d9a228;
      transform: rotate(-45deg);
      border: 2px solid #f6e7b3;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .gold-pin::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff8dd;
      position: absolute;
      top: 4px;
      left: 4px;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      width: 100%;
      border: none;
      min-height: 52px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.96rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: var(--primary);
      color: #102c1d;
    }

    .btn-light {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .btn-emergency {
      background: var(--danger);
      color: white;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #173d2a;
      color: #f2fff2;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="top-bar">
      <a class="back-link" href="{% url 'snakebite:community_home' %}" aria-label="Back to home">&larr;</a>
      <div class="header-copy">
        <h1>Nearest Help</h1>
      </div>
    </header>

    <section class="map-wrap" aria-label="Interactive nearest help map">
      <div id="nearest-help-map"></div>
    </section>

    <section class="facility-card">
      <h2 class="facility-name">Beposo Health Centre</h2>
      <p class="facility-line">8.6 km away · 15 min by road</p>
      <p class="status-ok">Anti-venom available</p>
      <p class="facility-line">Open 24/7 · In case of emergency, call 112</p>
    </section>

    <div class="actions">
      <a href="" class="btn btn-primary">Get Directions</a>
      <a href="tel:+233000000000" class="btn btn-light">Call for Transport Help</a>
      <a href="tel:112" class="btn btn-emergency">Emergency? Call 112</a>
    </div>

    {% include 'snakebite/_community_bottom_nav.html' %}
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    (function () {
      var map = L.map('nearest-help-map', {
        zoomControl: true,
        scrollWheelZoom: true
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      var facilityCoords = [
        { name: 'Beposo Health Centre', lat: 7.9600, lng: -1.0400, color: 'green' },
        { name: 'Regional Referral Unit', lat: 7.9900, lng: -1.0800, color: 'gold' }
      ];

      var bounds = [];

      facilityCoords.forEach(function (facility) {
        var icon = L.divIcon({
          className: facility.color === 'green' ? 'green-pin' : 'gold-pin',
          iconSize: [20, 20],
          iconAnchor: [10, 20],
          popupAnchor: [0, -20]
        });

        var marker = L.marker([facility.lat, facility.lng], { icon: icon }).addTo(map);
        marker.bindPopup(
          '<strong>' + facility.name + '</strong><br>' +
          'Open 24/7<br>' +
          'Anti-venom available'
        );
        bounds.push([facility.lat, facility.lng]);
      });

      var userLatLng = [7.9300, -1.0100];
      var userMarker = L.marker(userLatLng, {
        icon: L.divIcon({
          className: 'green-pin',
          iconSize: [20, 20],
          iconAnchor: [10, 20],
          popupAnchor: [0, -20]
        })
      }).addTo(map);
      userMarker.bindPopup('<strong>You are here</strong>');

      bounds.push(userLatLng);
      map.fitBounds(bounds, { padding: [30, 30] });
    })();
  </script>
</body>
</html>
