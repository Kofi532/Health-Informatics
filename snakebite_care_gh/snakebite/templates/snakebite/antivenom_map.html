<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antivenom Stock Map | Snakebite Care GH</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      --bg: #0f3822;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f8fff6;
      --muted: #cfe2d1;
      --accent: #9fe59a;
      --ok-text: #81f0b1;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(159, 229, 154, 0.16), transparent 30%),
        linear-gradient(180deg, #123d26 0%, var(--bg) 55%, #0b2818 100%);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 14px 14px 102px;
    }

    .screen {
      width: 100%;
      max-width: 460px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      margin-bottom: 12px;
      border-radius: 16px;
      background: rgba(9, 31, 20, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .back-link {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 20px;
      line-height: 1;
    }

    .header-copy h1 {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      line-height: 1.25;
    }

    .map-wrap {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      background: #153a27;
      height: 60vh;
      min-height: 320px;
    }

    #antivenom-map {
      width: 100%;
      height: 100%;
    }

    .drawer {
      display: grid;
      gap: 10px;
      max-height: clamp(180px, 33vh, 320px);
      overflow-y: auto;
      padding-right: 2px;
    }

    .facility-card {
      border-radius: 14px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
    }

    .facility-name {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 800;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .facility-line {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .status-ok {
      margin: 5px 0 0;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--ok-text);
    }

    .green-pin {
      width: 20px;
      height: 20px;
      border-radius: 50% 50% 50% 0;
      background: #1e7a3e;
      transform: rotate(-45deg);
      border: 2px solid #c7f5d2;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .green-pin::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eafbeb;
      position: absolute;
      top: 4px;
      left: 4px;
    }

    .tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent, rgba(11, 40, 24, 0.92) 30%, rgba(11, 40, 24, 0.98));
    }

    .tabs-inner {
      max-width: 460px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 8px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.13);
    }

    .tab.active {
      color: #0f3822;
      background: var(--accent);
      border-color: rgba(159, 229, 154, 0.7);
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #173d2a;
      color: #f2fff2;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="top-bar">
      <a class="back-link" href="{% url 'snakebite:home' %}" aria-label="Back to home">&larr;</a>
      <div class="header-copy">
        <h1>ANTIVENOM STOCK MAP</h1>
      </div>
    </header>

    <section class="map-wrap" aria-label="Interactive facility map">
      <div id="antivenom-map"></div>
    </section>

    <section class="drawer" aria-label="Nearby facilities list">
      <article class="facility-card">
        <h2 class="facility-name">DISTRICT HOSPITAL</h2>
        <p class="facility-line">Donkorkrom</p>
        <p class="status-ok">Antivenom available</p>
        <p class="facility-line">Cost: GHS 300</p>
      </article>

      <article class="facility-card">
        <h2 class="facility-name">TEASE HEALTH CENTER</h2>
        <p class="facility-line">Code: GHS 160 | Antivenom available | Cost: GHS 160</p>
      </article>

      <article class="facility-card">
        <h2 class="facility-name">AMANKWAKROM CHPS</h2>
        <p class="facility-line">Antivenom available | Cost: GHS 160</p>
      </article>
    </section>
  </main>

  {{ facilities_payload|json_script:"facilities-json" }}

  <nav class="tabs" aria-label="Antivenom tabs">
    <div class="tabs-inner">
      <div class="tab active">
        <span aria-hidden="true">&#128205;</span>
        <span>Map</span>
      </div>
      <div class="tab">
        <span aria-hidden="true">&#128202;</span>
        <span>List</span>
      </div>
      <div class="tab">
        <span aria-hidden="true">&#9432;</span>
        <span>Info</span>
      </div>
    </div>
  </nav>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    (function () {
      var payloadElement = document.getElementById('facilities-json');
      var facilities = payloadElement ? JSON.parse(payloadElement.textContent) : [];

      var map = L.map('antivenom-map', {
        zoomControl: true,
        scrollWheelZoom: true
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      var validFacilities = facilities.filter(function (facility) {
        return facility.latitude !== null && facility.longitude !== null;
      });

      if (validFacilities.length === 0) {
        map.setView([7.9465, -1.0232], 6);
        return;
      }

      var bounds = [];
      validFacilities.forEach(function (facility) {
        var greenMarker = L.divIcon({
          className: 'green-pin',
          iconSize: [20, 20],
          iconAnchor: [10, 20],
          popupAnchor: [0, -20]
        });

        var marker = L.marker([facility.latitude, facility.longitude], { icon: greenMarker }).addTo(map);
        var priceText = facility.antivenom_cost !== null ? 'GHS ' + facility.antivenom_cost : 'Not listed';
        var phoneText = facility.contact_number || 'No contact number';
        marker.bindPopup(
          '<strong>' + facility.name + '</strong><br>' +
          facility.facility_type + ' · ' + facility.region + '<br>' +
          'Stock: Available<br>' +
          'Price: ' + priceText + '<br>' +
          'Phone: ' + phoneText
        );
        bounds.push([facility.latitude, facility.longitude]);
      });

      map.fitBounds(bounds, { padding: [26, 26] });
    })();
  </script>
</body>
</html>
