<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenomGuard AI | Assessment</title>
  <style>
    :root {
      --bg: #f5f7f3;
      --panel: #ffffff;
      --text: #17332d;
      --muted: #526d65;
      --primary: #0f7a65;
      --primary-soft: #ebf7f2;
      --border: #dfe7e1;
      --shadow: 0 10px 28px rgba(17, 49, 39, 0.06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .screen {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
      padding: 22px 16px 90px;
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 22px;
    }

    .step {
      height: 42px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.9rem;
      background: #edf2ee;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .step.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: rgba(15, 122, 101, 0.15);
      box-shadow: inset 0 0 0 1px rgba(15, 122, 101, 0.12);
    }

    h2 {
      margin: 0 0 18px;
      font-size: 1.8rem;
      line-height: 1.2;
    }

    .choice-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .choice-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
    }

    .choice-card .icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #edf9f4;
      display: grid;
      place-items: center;
      font-size: 1.6rem;
      color: var(--primary);
      flex-shrink: 0;
    }

    .choice-text strong {
      display: block;
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    .choice-text span {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      min-height: 50px;
      padding: 0 20px;
      font-weight: 700;
      font-size: 0.96rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-back {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
      flex: 1;
    }

    .btn-next {
      background: var(--primary);
      color: white;
      flex: 1.2;
      box-shadow: 0 10px 18px rgba(15, 122, 101, 0.22);
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="progress" aria-label="Assessment progress">
      <div class="step active">1</div>
      <div class="step">2</div>
      <div class="step">3</div>
      <div class="step">4</div>
    </div>

    <h2>What type of snake bit the person?</h2>

    <form method="post">
      {% csrf_token %}
      <div class="choice-grid">
        <label class="choice-card" for="viper">
          <input id="viper" type="radio" name="snake_type" value="viper" checked hidden>
          <span class="icon" aria-hidden="true">🐍</span>
          <span class="choice-text">
            <strong>Viper</strong>
            <span>Short, thick body</span>
          </span>
        </label>

        <label class="choice-card" for="cobra">
          <input id="cobra" type="radio" name="snake_type" value="cobra" hidden>
          <span class="icon" aria-hidden="true">🩺</span>
          <span class="choice-text">
            <strong>Cobra</strong>
            <span>Spread hood</span>
          </span>
        </label>

        <label class="choice-card" for="mamba">
          <input id="mamba" type="radio" name="snake_type" value="mamba" hidden>
          <span class="icon" aria-hidden="true">🌿</span>
          <span class="choice-text">
            <strong>Mamba</strong>
            <span>Long, slender</span>
          </span>
        </label>

        <label class="choice-card" for="other">
          <input id="other" type="radio" name="snake_type" value="other" hidden>
          <span class="icon" aria-hidden="true">❓</span>
          <span class="choice-text">
            <strong>Other / Don’t know</strong>
            <span>Unsure of the snake type</span>
          </span>
        </label>
      </div>

      <div class="footer">
        <a class="btn btn-back" href="{% url 'snakebite:community_home' %}">Back</a>
        <button class="btn btn-next" type="submit">Next</button>
      </div>
    </form>

    {% include 'snakebite/_community_bottom_nav.html' %}
  </main>
</body>
</html>
