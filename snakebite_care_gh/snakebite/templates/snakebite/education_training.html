<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Education and Training | VenomGuard AI</title>
  <style>
    :root {
      --bg: #0f3822;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f8fff6;
      --muted: #cfe2d1;
      --accent: #9fe59a;
      --accent-strong: #1e7a3e;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(159, 229, 154, 0.16), transparent 30%),
        linear-gradient(180deg, #123d26 0%, var(--bg) 55%, #0b2818 100%);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 14px 14px 106px;
    }

    .screen {
      width: 100%;
      max-width: 460px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      margin-bottom: 14px;
      border-radius: 16px;
      background: rgba(9, 31, 20, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .back-link {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 20px;
      line-height: 1;
    }

    .header-copy h1 {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      line-height: 1.25;
    }

    .modules {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .module-card {
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 16px;
      padding: 13px;
      text-decoration: none;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
    }

    .module-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(159, 229, 154, 0.16);
      border: 1px solid rgba(159, 229, 154, 0.34);
      font-size: 1rem;
      flex: 0 0 40px;
    }

    .module-title {
      margin: 0;
      font-size: 0.96rem;
      line-height: 1.35;
      font-weight: 700;
    }

    .tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent, rgba(11, 40, 24, 0.92) 30%, rgba(11, 40, 24, 0.98));
    }

    .tabs-inner {
      max-width: 460px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 8px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.13);
    }

    .tab.active {
      color: #0f3822;
      background: var(--accent);
      border-color: rgba(159, 229, 154, 0.7);
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="top-bar">
      <a class="back-link" href="{% url 'snakebite:home' %}" aria-label="Back to home">&larr;</a>
      <div class="header-copy">
        <h1>EDUCATION &amp; TRAINING</h1>
      </div>
    </header>

    {% include 'snakebite/_profile_nav.html' %}

    <section class="modules" aria-label="Education modules">
      <a class="module-card" href="#">
        <span class="module-icon" aria-hidden="true">📖</span>
        <p class="module-title">Snakebite Management Guidelines</p>
      </a>

      <a class="module-card" href="#">
        <span class="module-icon" aria-hidden="true">🧰</span>
        <p class="module-title">First Aid for Snakebite</p>
      </a>

      <a class="module-card" href="#">
        <span class="module-icon" aria-hidden="true">🐍💲</span>
        <p class="module-title">Snake Biology &amp; Prevention</p>
      </a>

      <a class="module-card" href="#">
        <span class="module-icon" aria-hidden="true">▶️</span>
        <p class="module-title">Training Videos &amp; Demonstrations</p>
      </a>

      <a class="module-card" href="#">
        <span class="module-icon" aria-hidden="true">⬇️</span>
        <p class="module-title">Posters &amp; Job Aids</p>
      </a>
    </section>
  </main>

  <nav class="tabs" aria-label="Education tabs">
    <div class="tabs-inner">
      <div class="tab active">
        <span aria-hidden="true">🎓</span>
        <span>Learn</span>
      </div>
      <div class="tab">
        <span aria-hidden="true">📥</span>
        <span>Downloads</span>
      </div>
      <div class="tab">
        <span aria-hidden="true">🔖</span>
        <span>Bookmarks</span>
      </div>
    </div>
  </nav>
</body>
</html>
